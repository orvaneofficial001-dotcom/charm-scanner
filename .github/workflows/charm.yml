name: Charm scanner

# Horario (hora de Alemania en INVIERNO = UTC+1). Los cron de GitHub van en UTC.
#   09:00-13:00  cada hora        -> 09:00 10:00 11:00 12:00
#   13:00-16:00  cada 45 minutos  -> 13:00 13:45 14:30 15:15
#   16:00-21:45  cada 30 minutos  -> 16:00 ... 21:30
#   21:45-09:00  cada 2 horas     -> 21:45 23:45 01:45 03:45 05:45 07:45
# En VERANO (UTC+2) resta una hora más a las horas UTC de abajo (o dímelo y lo cambio).
on:
  schedule:
    - cron: "0 8,9,10,11 * * *"
    - cron: "0 12 * * *"
    - cron: "45 12 * * *"
    - cron: "30 13 * * *"
    - cron: "15 14 * * *"
    - cron: "0,30 15-20 * * *"
    - cron: "45 20,22,0,2,4,6 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Prueba: ignora la memoria, amplía el precio hasta 50 $ y manda un resumen a Telegram"
        type: boolean
        default: false

# Permiso para guardar el registro de ofertas (ofertas.csv) en el repositorio
permissions:
  contents: write

# Una sola ejecución a la vez, para que no se pisen entre ellas
concurrency:
  group: charm-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # Memoria entre ejecuciones: anuncios ya vistos (seen.json) y resumen diario (state.json).
      - name: Memoria de anuncios vistos
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            state.json
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - run: python charm_scanner.py
        env:
          ONCE: "1"
          TEST: ${{ github.event.inputs.test }}
          WEAPON_FILTER: ""            # pon aquí un arma, p. ej. "AK-47", o déjalo vacío
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Si hubo ofertas nuevas, guarda ofertas.csv en el repositorio
      - name: Guardar registro de ofertas
        if: ${{ github.event.inputs.test != 'true' }}
        run: |
          if [ -n "$(git status --porcelain ofertas.csv)" ]; then
            git config user.name "charm-bot"
            git config user.email "charm-bot@users.noreply.github.com"
            git add ofertas.csv
            git commit -m "Registro de ofertas"
            git pull --rebase || true
            git push
          else
            echo "Sin ofertas nuevas que guardar."
          fi
