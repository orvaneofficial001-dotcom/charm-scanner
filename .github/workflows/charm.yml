name: Charm scanner

# Horario (hora de Alemania en INVIERNO = UTC+1). Los cron de GitHub van en UTC.
#   09:00-13:00  cada hora        -> 09:00 10:00 11:00 12:00
#   13:00-16:00  cada 45 minutos  -> 13:00 13:45 14:30 15:15
#   16:00-21:45  cada 30 minutos  -> 16:00 ... 21:30
#   21:45-09:00  cada 2 horas     -> 21:45 23:45 01:45 03:45 05:45 07:45
# En VERANO (UTC+2) resta una hora más a las horas UTC de abajo (o dímelo y lo cambio).
on:
  schedule:
    - cron: "0 8,9,10,11 * * *"
    - cron: "0 12 * * *"
    - cron: "45 12 * * *"
    - cron: "30 13 * * *"
    - cron: "15 14 * * *"
    - cron: "0,30 15-20 * * *"
    - cron: "45 20,22,0,2,4,6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # Elige cuántos minutos hacia atrás mirar según la hora local (Alemania),
      # para cubrir exactamente el hueco desde la ejecución anterior.
      - name: Calcular ventana
        run: |
          H=$(TZ=Europe/Berlin date +%H); M=$(TZ=Europe/Berlin date +%M)
          T=$((10#$H * 60 + 10#$M))
          if   [ $T -ge 540 ] && [ $T -lt 570 ];  then W=80    # 09:00 (tras la noche, desde 07:45)
          elif [ $T -ge 570 ] && [ $T -lt 780 ];  then W=65    # 09:30-13:00 cada hora
          elif [ $T -ge 780 ] && [ $T -lt 960 ];  then W=50    # 13:00-16:00 cada 45 min
          elif [ $T -ge 960 ] && [ $T -lt 1300 ]; then W=35    # 16:00-21:40 cada 30 min
          elif [ $T -ge 1300 ] && [ $T -lt 1350 ]; then W=25   # 21:45 (tras el de 21:30)
          else W=125                                           # noche, cada 2 horas
          fi
          echo "MAX_AGE_MIN=$W" >> $GITHUB_ENV
          echo "Hora local $H:$M -> ventana $W min"

      - run: python charm_scanner.py
        env:
          ONCE: "1"
          PAGES: "4"
          WEAPON_FILTER: ""            # pon aquí un arma, p. ej. "AK-47", o déjalo vacío
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
